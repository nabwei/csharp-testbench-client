name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  client:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: client-project
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nabwei/measurement-testbench
          ref: 67fc7b195b1c013fc08f7e677650220d113f05a3
          path: simulator
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cmake -S simulator -B sim-build -DBUILD_TESTING=OFF
      - run: cmake --build sim-build --config Release
      - run: dotnet test client-project/Tests/Tests.csproj --configuration Release
      - shell: pwsh
        run: |
          $binary = if ($IsWindows) { 'sim-build/bin/sensor_sim.exe' } else { 'sim-build/bin/sensor_sim' }
          python client-project/test_integration.py $binary
